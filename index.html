<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação 03 - Lotes</title>

    <script src="js/script.js" defer></script>
</head>
<body>
    <div id="geral">
        
        <h1>Avaliação 03 - Lotes</h1>
        <h2>Calcule o valor de um Lote</h2>

        <form id="form-lote">
            <label for="quadra">Quadra:</label>
            <input type="text" id="quadra" name="quadra"><p></p>

            <label for="lot">Lote:</label>
            <input type="text" id="lot" name="lot"><p></p>

            <label for="comp">Comprimento do Lote (m):</label>
            <input type="text" name="comp" id="comp"><p></p>

            <label for="larg">Largura do Lote (m):</label>
            <input type="text" name="larg" id="larg"><p></p>

            <button type="submit">Verificar</button>
            <button type="reset">Limpar</button>
        </form>
    </div>

    <div id="div-lista">

    </div>
</body>
</html>
